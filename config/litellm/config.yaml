model_list:
  - model_name: local-code
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://ollama:11434
      timeout: 1800
    model_info:
      max_input_tokens: 14336

  - model_name: local-fast
    litellm_params:
      model: ollama_chat/qwen3:4b
      api_base: http://ollama:11434
      timeout: 600
    model_info:
      max_input_tokens: 14336

  - model_name: local-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

# Add frontier-code only after a provider and exact released model have been
# qualified. Keeping an empty provider entry here makes LiteLLM fail at boot.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  request_timeout: 1800
  num_retries: 1

router_settings:
  enable_pre_call_checks: true
  allowed_fails: 1
  cooldown_time: 30

