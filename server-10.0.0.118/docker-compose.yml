services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /mnt/Storage1/data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_VULKAN=1
      # devbot: Larger context for repo maps / pasted docs,
      # keep the "smart" + "fast" models resident, one request at a time.
      - OLLAMA_CONTEXT_LENGTH=16384
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=1
    networks:
      - homelab

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      - ollama
    networks:
      - homelab

  devbot:
    build: ./devbot
    container_name: devbot
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/Los_Angeles
      - LLM_BASE_URL=http://litellm:4000/v1
      - DATABASE_URL=postgresql://saas:saas_dev_pass@saas-postgres:5432/devbot
      - DATA_DIR=/data
      - LLM_CONTEXT_TOKENS=16384
      - LLM_OUTPUT_TOKENS=4096
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen3-coder:30b
    volumes:
      - /mnt/Storage1/devbot:/data
    depends_on:
      litellm:
        condition: service_started
      saas-postgres:
        condition: service_healthy
    networks:
      - homelab

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=false
    volumes:
      - ./data/open-webui:/app/backend/data
    depends_on:
      - ollama
    networks:
      - homelab

  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - SEARXNG_SECRET=homelab-searxng-secret-2026
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - homelab

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - DEFAULT_WORKSPACE=/config/workspace
    volumes:
      - ./data/code-server:/config
      - /mnt/Storage1/data:/mnt/Storage1/data
    networks:
      - homelab

  saas-postgres:
    image: pgvector/pgvector:pg16
    container_name: saas-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=saas
      - POSTGRES_PASSWORD=saas_dev_pass
      - POSTGRES_DB=saas_dev
    volumes:
      - /mnt/Storage1/data/saas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homelab

  saas-redis:
    image: redis:7-alpine
    container_name: saas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /mnt/Storage1/data/saas-redis:/data
    networks:
      - homelab

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=saas-postgres
    depends_on:
      - saas-postgres
    networks:
      - homelab

networks:
  homelab:
    name: homelab
