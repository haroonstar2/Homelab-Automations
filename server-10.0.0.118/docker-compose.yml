volumes:
  sandbox-tls:

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /mnt/Storage1/data/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    networks:
      - homelab

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=false
    volumes:
      - ./data/open-webui:/app/backend/data
    depends_on:
      - ollama
    networks:
      - homelab

  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.8.1
    container_name: sandbox-certs
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: "1"
    volumes:
      - sandbox-tls:/tls
    networks:
      - homelab

  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.8.1
    container_name: sandbox-api
    restart: unless-stopped
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      SANDBOX_API_KEYS: homelab-sandbox-key-2026
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: homelab-reg-token-2026
      SANDBOX_API_RUNNER_API_KEY: homelab-runner-key-2026
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - homelab

  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:1.8.1
    container_name: sandbox-runner-1
    restart: unless-stopped
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_REGISTRATION_TOKEN: homelab-reg-token-2026
      SANDBOX_RUNNER_API_KEYS: homelab-runner-key-2026
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:1.8.1
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox-tls:/tls:ro
    networks:
      - homelab

  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - SEARXNG_SECRET=homelab-searxng-secret-2026
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - homelab

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    depends_on:
      sandbox-api:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=America/Los_Angeles
      - TZ=America/Los_Angeles
      - OLLAMA_HOST=ollama:11434
      - N8N_INSTANCE_AI_SEARXNG_URL=http://searxng:8080
      - N8N_INSTANCE_AI_SANDBOX_ENABLED=true
      - N8N_INSTANCE_AI_SANDBOX_PROVIDER=n8n-sandbox
      - N8N_INSTANCE_AI_SANDBOX_API_URL=http://sandbox-api:8080
      - N8N_SANDBOX_SERVICE_URL=http://sandbox-api:8080
      - N8N_SANDBOX_SERVICE_API_KEY=homelab-sandbox-key-2026
    volumes:
      - ./data/n8n:/home/node/.n8n
      - /mnt/Storage1/data/n8n-files:/files
    networks:
      - homelab

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - DEFAULT_WORKSPACE=/config/workspace
    volumes:
      - ./data/code-server:/config
      - /mnt/Storage1/data:/mnt/Storage1/data
    networks:
      - homelab

  windmill-db:
    image: postgres:16-alpine
    container_name: windmill-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=windmill_pass
      - POSTGRES_DB=windmill
    volumes:
      - ./data/windmill-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homelab

  windmill-server:
    image: ghcr.io/windmill-labs/windmill:main
    container_name: windmill-server
    restart: unless-stopped
    ports:
      - "8100:8000"
    environment:
      - DATABASE_URL=postgres://postgres:windmill_pass@windmill-db:5432/windmill?sslmode=disable
      - MODE=server
      - ALLOW_PRIVATE_AI_BASE_URLS=true
    depends_on:
      windmill-db:
        condition: service_healthy
    networks:
      - homelab

  windmill-worker:
    image: ghcr.io/windmill-labs/windmill:main
    container_name: windmill-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://postgres:windmill_pass@windmill-db:5432/windmill?sslmode=disable
      - MODE=worker
      - WORKER_GROUP=default
      - ALLOW_PRIVATE_AI_BASE_URLS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/windmill-cache:/tmp/windmill/cache
    depends_on:
      windmill-db:
        condition: service_healthy
    networks:
      - homelab

  saas-postgres:
    image: pgvector/pgvector:pg16
    container_name: saas-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=saas
      - POSTGRES_PASSWORD=saas_dev_pass
      - POSTGRES_DB=saas_dev
    volumes:
      - /mnt/Storage1/data/saas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homelab

  saas-redis:
    image: redis:7-alpine
    container_name: saas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /mnt/Storage1/data/saas-redis:/data
    networks:
      - homelab

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=saas-postgres
    depends_on:
      - saas-postgres
    networks:
      - homelab

networks:
  homelab:
    name: homelab
